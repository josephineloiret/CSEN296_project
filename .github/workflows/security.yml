name: Security and regression checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r project/requirements.lock.txt pip-audit
      - run: python -m pytest -q
      - name: Run synthetic red-team campaign and write evidence
        run: python project/redteam/run_campaign.py --out docs/test-evidence/campaign-ci.json
      - run: python project/scripts/scan_secrets.py
      - run: pip-audit -r project/requirements.lock.txt --strict
      - run: docker build --pull -t refundguard:ci project
      - name: Scan container for critical and high vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.1 image --exit-code 1 --severity HIGH,CRITICAL refundguard:ci
