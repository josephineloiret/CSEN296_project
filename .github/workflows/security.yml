name: Security and regression checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock.txt pip-audit
      - run: python -m pytest -q
      - run: python scripts/scan_secrets.py
      - run: pip-audit -r requirements.lock.txt --strict
      - run: docker build --pull -t refundguard:ci .
      - name: Scan container for critical and high vulnerabilities
        run: |
          set +e
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP:/reports" aquasec/trivy:0.76.1 image --scanners vuln --format json --output /reports/refundguard-trivy.json --exit-code 1 --severity HIGH,CRITICAL refundguard:ci
          scan_status=$?
          set -e
          python scripts/summarize_container_scan.py "$RUNNER_TEMP/refundguard-trivy.json"
          exit "$scan_status"
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Scan full Git history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --retry 3 "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts="--all --full-history" .
